name: Build, Test, and Package Reasonix (Windows)

on:
  workflow_dispatch: # Allows you to click "Run workflow" manually

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main-v2 # Pulls the absolute latest commits from the active branch

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build Windows Executable
        shell: bash
        run: go build -o reasonix.exe -v ./cmd/reasonix 

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-latest-tested-windows
          path: reasonix.exe
          retention-days: 7
